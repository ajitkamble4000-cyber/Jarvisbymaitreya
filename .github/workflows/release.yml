name: Release Artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  android-debug:
    name: Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android 35 build components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        working-directory: apps/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean testDebugUnitTest assembleDebug

      - name: Verify APK
        shell: bash
        run: test -s apps/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-android-debug.apk
          path: apps/android/app/build/outputs/apk/debug/*.apk

  windows-desktop:
    name: Windows desktop bundle
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build and package Windows bundle
        working-directory: apps/desktop
        run: npm run dist -- --win nsis --x64

      - name: Verify Windows executable
        shell: pwsh
        run: |
          $installer = Get-ChildItem "apps/desktop/release/*.exe" | Select-Object -First 1
          if ($null -eq $installer -or $installer.Length -le 0) { throw "Windows installer is missing or empty." }

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-desktop-windows
          path: |
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe

  github-release:
    name: Publish to GitHub Release
    needs: [android-debug, windows-desktop]
    runs-on: ubuntu-24.04
    if: >-
      always() && startsWith(github.ref, 'refs/tags/') &&
      needs.windows-desktop.result == 'success' &&
      (needs.android-debug.result == 'success' || needs.android-debug.result == 'failure')
    steps:
      - name: Download APK artifact
        if: needs.android-debug.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: jarvis-android-debug.apk
          path: dist/android

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: jarvis-desktop-windows
          path: dist/windows

      - name: Verify downloaded artifacts
        shell: bash
        env:
          ANDROID_RESULT: ${{ needs.android-debug.result }}
        run: |
          test -n "$(find dist/windows -type f -name '*.exe' -size +0c -print -quit)"
          if [[ "$ANDROID_RESULT" == "success" ]]; then
            test -n "$(find dist/android -type f -name '*.apk' -size +0c -print -quit)"
          fi

      - name: Prepare release asset list
        id: assets
        shell: bash
        env:
          ANDROID_RESULT: ${{ needs.android-debug.result }}
        run: |
          files="$(find dist/windows -maxdepth 1 -type f \( -name '*.exe' -o -name '*.zip' \) -size +0c -print | sort)"
          if [[ "$ANDROID_RESULT" == "success" ]]; then
            files+=$'\n'"$(find dist/android -type f -name '*.apk' -size +0c -print | sort)"
          fi
          printf 'files<<JARVIS_ASSETS\n%s\nJARVIS_ASSETS\n' "$files" >> "$GITHUB_OUTPUT"

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.assets.outputs.files }}
