name: Release Artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  android-debug:
    name: Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 build components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        working-directory: apps/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-android-debug.apk
          path: apps/android/app/build/outputs/apk/debug/*.apk

  windows-desktop:
    name: Windows desktop bundle
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build and package Windows bundle
        working-directory: apps/desktop
        run: npm run dist -- --win portable --x64

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-desktop-windows
          path: |
            apps/desktop/release/*.zip
            apps/desktop/release/**/*.exe
            apps/desktop/release/win-unpacked/**

  github-release:
    name: Publish to GitHub Release
    needs: [android-debug, windows-desktop]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: jarvis-android-debug.apk
          path: dist/android

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: jarvis-desktop-windows
          path: dist/windows

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/android/*.apk
            dist/windows/**/*.zip
            dist/windows/**/*.exe
